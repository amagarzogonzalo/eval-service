[workspace]
members = [
    "crates/eval-core",
    "crates/eval-protocol",
    "crates/eval-graders",
    "crates/eval-runner",
    "crates/eval-cli",
    "crates/eval-usage",
    "crates/eval-proxy",
    "adapters/rust_shim",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
