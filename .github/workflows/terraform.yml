name: terraform
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Validate cloud-init
        run: |
          if command -v cloud-init >/dev/null 2>&1; then
            cloud-init schema --config-file infra/aws/cloud-init.yaml
          else
            ruby -ryaml -e 'YAML.load_file("infra/aws/cloud-init.yaml"); puts "cloud-init.yaml is valid YAML"'
          fi

      - name: make tf-validate
        run: make tf-validate
