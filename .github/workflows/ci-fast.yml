name: ci-fast
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # Linux uses the Makefile gate (fmt + clippy + tests); Windows
      # images do not ship make, so it runs the raw commands.
      - name: make verify
        if: runner.os != 'Windows'
        run: make verify
      - name: cargo verify
        if: runner.os == 'Windows'
        run: cargo test --workspace --locked --all-targets --all-features
      - name: cargo fmt
        if: runner.os == 'Windows'
        run: cargo fmt --all -- --check
      - name: cargo clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo check
        if: runner.os == 'Windows'
        run: cargo check --workspace --all-targets --all-features
      - name: cargo doc
        if: runner.os == 'Windows'
        run: |
          $env:RUSTDOCFLAGS = '-D warnings'
          cargo doc --workspace --no-deps --all-features
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - name: make verify on ARM64
        run: make verify
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@ccc8c1f930153b792217f06c65a38f23a882993a # 1.85
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: make test
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # A6: warm the cargo cache first (a dead proxy cannot fetch
      # dependencies), then prove the suite makes zero network calls.
      # NOTE: only lowercase proxy names — uppercase HTTP_PROXY /
      # HTTPS_PROXY in step env fails workflow parsing on GitHub.
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked --offline --all-targets --all-features
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: 127.0.0.1,localhost
          CARGO_NET_OFFLINE: "true"
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: make python-lint
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: secrets committed before scanning was added still
          # count as leaks.
          fetch-depth: 0
      # gitleaks CLI (MIT). The `gitleaks/gitleaks-action` wrapper is
      # commercial for organization accounts; the pinned CLI binary stays
      # free and needs no license key.
      - name: Scan full git history for secrets
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --verbose
