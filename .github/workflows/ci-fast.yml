name: ci-fast
on:
  push:
  pull_request:
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test --workspace --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo test --workspace --locked
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # A6: warm the cargo cache first (a dead proxy cannot fetch
      # dependencies), then prove the suite makes zero network calls.
      # NOTE: only lowercase proxy names — uppercase HTTP_PROXY /
      # HTTPS_PROXY in step env fails workflow parsing on GitHub.
      - run: cargo fetch --locked
      - run: cargo test --workspace --locked --offline
        env:
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          CARGO_NET_OFFLINE: "true"
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check adapters examples integrations --line-length 100
      - run: python3 -m py_compile adapters/python_shim/main.py
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: secrets committed before scanning was added still
          # count as leaks.
          fetch-depth: 0
      # gitleaks CLI (MIT). The `gitleaks/gitleaks-action` wrapper is
      # commercial for organization accounts; the pinned CLI binary stays
      # free and needs no license key.
      - name: Scan full git history for secrets
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --config .gitleaks.toml --redact --verbose
