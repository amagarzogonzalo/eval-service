# Deterministic replay of the real research-orchestration-agents workflow.
#
# The target owns the cassettes (LLM/search/scrape); eval-service grades the
# target harness result. No network or provider keys are used in replay.
#
#   EVAL_RESEARCH_PYTHON=/srv/eval-venvs/research-agents/bin/python
#   EVAL_RESEARCH_REPO=/srv/targets/research-orchestration-agents
#   eval check integrations/research_agents/suite.yaml --probe
#
# Live recording is intentionally not wired: it would write the target's
# cassettes and must route through eval proxy as the single observer.
suite: research-agents-replay
version: 1
target:
  argv: ["$PYTHON", "integrations/research_agents/adapter.py"]
  mode: oneshot
env_allowlist: [EVAL_RESEARCH_PYTHON, EVAL_RESEARCH_REPO, EVAL_RESEARCH_CASE]
gate:
  min_pass_rate: 1.0
cases:
  - id: research-full-replay
    tags: [agent, research, cassette, offline]
    input:
      params:
        python: "$EVAL_RESEARCH_PYTHON"
        repo: "$EVAL_RESEARCH_REPO"
        case: research
    limits: { timeout_ms: 600000, max_output_bytes: 1048576 }
    trials: 1
    deterministic: true
    graders:
      - kind: exit_code
        expect: 0
      - kind: exact
        field: output.data.status
        value: pass
      - kind: json_schema
        field: output.data
        schema:
          type: object
          required: [case, ok, failures, usage, artifact_chars, nsources, digest]
          properties:
            ok: { const: true }
            artifact_chars: { type: integer }
            nsources: { type: integer }
            usage: { type: object }
            digest: { type: object }
      - kind: range
        field: output.data.artifact_chars
        min: 1000
      - kind: range
        field: output.data.nsources
        min: 1
      - kind: range
        field: output.data.usage.total_tokens
        min: 1
        max: 30000
      - kind: not_regex
        field: output.text
        pattern: "BREAKING"
