# Storytelling RAG runs for the CV evidence video.
#
# Separate from the frozen v0.3.0 benchmark: no CI, no weekly schedule, no
# production suite edits. Each topic runs as its own case so one failure does
# not hide the other stories.
#
# Single narrative trial per topic. `deterministic: true` is set only because
# the suite validator requires trials >= 2 for cases marked non-deterministic;
# this suite makes no stability claim from one sample.
#
#   export EVAL_RESEARCH_SERVICE_URL=https://research-orchestration-agents.onrender.com
#   export EVAL_RESEARCH_SERVICE_LANE=remote
#   export EVAL_RESEARCH_SERVICE_TOKEN=...   # from /etc/eval/research-service.env
#   eval check integrations/research_agents/story_service.yaml --probe
#   eval run integrations/research_agents/story_service.yaml \
#     --origin live --ref story-rag --lane remote-service --workers 1 \
#     --store /var/lib/eval-runs --model target-service:remote \
#     --target-version research-orchestration-agents --json
#
# Runner lane recorded at run time: remote-service. Ref: story-rag.
suite: research-agents-story
version: 1
target:
  argv: ["$PYTHON", "integrations/research_agents/adapter.py"]
  mode: oneshot
env_allowlist: [EVAL_RESEARCH_SERVICE_URL, EVAL_RESEARCH_SERVICE_TOKEN,
  RENDER_API_KEY, EVAL_RESEARCH_SERVICE_LANE, EVAL_RESEARCH_LOCAL_SERVICE,
  EVAL_RESEARCH_REPO, EVAL_RESEARCH_PYTHON, EVAL_RESEARCH_OPENROUTER_BASE,
  EVAL_RESEARCH_SERVICE_WORKROOT, EVAL_RESEARCH_KEEP_WORKDIR, EVAL_RESEARCH_TOPIC,
  EVAL_RESEARCH_DATASET, EVAL_RESEARCH_TIMEOUT_S, EVAL_RESEARCH_ARTIFACT_OUT,
  EVAL_RESEARCH_USAGE_STORE, EVAL_RESEARCH_USAGE_PROJECT,
  EVAL_RESEARCH_USAGE_TAG, EVAL_FREE_MODEL, EVAL_FREE_MODEL_ALLOWLIST,
  EVAL_RESEARCH_REQUIRE_FREE_MODELS, TRACEPARENT, EVAL_TRACEPARENT,
  EVAL_TRACE_ID, EVAL_RESEARCH_TRACE_ENDPOINT, EVAL_OTEL_ENDPOINT]
gate:
  min_pass_rate: 1.0
cases:
  - id: story-service-health
    tags: [agent, research, live, service, health, story]
    input:
      params:
        mode: live_service
        health_only: true
        service_url: "$EVAL_RESEARCH_SERVICE_URL"
        lane: "$EVAL_RESEARCH_SERVICE_LANE"
        timeout_s: 120
    limits: { timeout_ms: 150000, max_output_bytes: 1048576 }
    trials: 1
    deterministic: true
    presets: [no_secret_leak]
    graders:
      - kind: exit_code
        expect: 0
      - kind: exact
        field: output.data.status
        value: ready
      - kind: json_schema
        field: output.data
        schema:
          type: object
          required: [lane, kind, status, service]
          properties:
            kind: { const: health }
            status: { const: ready }
            lane: { enum: [local, remote] }
            service:
              type: object
              required: [health, readiness, effective_ready]
              properties:
                effective_ready: { const: true }
                health:
                  type: object
                  required: [status, ok]
                  properties:
                    status: { type: integer }
                    ok: { const: true }
                    ms: { type: integer }
                readiness:
                  type: object
                  required: [status, ok, checks]
                  properties:
                    status: { type: integer }
                    ok: { type: boolean }
                    ms: { type: integer }
                    checks: { type: object }

  - id: story-rag-basics
    tags: [agent, research, live, service, story]
    input:
      params:
        mode: live_service
        service_url: "$EVAL_RESEARCH_SERVICE_URL"
        lane: "$EVAL_RESEARCH_SERVICE_LANE"
        dataset: datasets/research_story/topics.json
        topic: rag-basics
        timeout_s: 1200
        poll_s: 2
        poll_max_s: 10
    limits: { timeout_ms: 1260000, max_output_bytes: 1048576 }
    trials: 1
    deterministic: true
    presets: [no_secret_leak]
    graders:
      - kind: exit_code
        expect: 0
      - kind: exact
        field: output.data.status
        value: pass
      - kind: json_schema
        field: output.data
        schema:
          type: object
          required: [lane, topic, kind, status, failures, service, task_id,
            thread_id, artifact_chars, artifact_sha256, citations, nsources,
            usage, model_policy, trace_id]
          properties:
            kind: { const: research }
            status: { const: pass }
            lane: { enum: [local, remote] }
            task_id: { type: string, minLength: 8 }
            thread_id: { type: string, minLength: 1 }
            artifact_chars: { type: integer }
            artifact_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            citations: { type: integer }
            nsources: { type: integer }
            trace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
            failures: { type: array }
            usage: { type: object }
            model_policy: { type: object }
            service:
              type: object
              required: [health, readiness, effective_ready, submit,
                poll_count, e2e_ms]
              properties:
                effective_ready: { const: true }
                poll_count: { type: integer }
                e2e_ms: { type: integer }
                submit:
                  type: object
                  required: [status, ms]
                  properties:
                    status: { type: integer }
                    ms: { type: integer }
      - kind: range
        field: output.data.artifact_chars
        min: 1500
      - kind: range
        field: output.data.citations
        min: 3
      - kind: range
        field: output.data.nsources
        min: 3
      - kind: range
        field: output.data.service.poll_count
        min: 1
      - kind: range
        field: output.data.service.e2e_ms
        min: 1
      - kind: not_regex
        field: output.text
        pattern: "BREAKING"

  - id: story-rag-failures
    tags: [agent, research, live, service, story]
    input:
      params:
        mode: live_service
        service_url: "$EVAL_RESEARCH_SERVICE_URL"
        lane: "$EVAL_RESEARCH_SERVICE_LANE"
        dataset: datasets/research_story/topics.json
        topic: rag-failures
        timeout_s: 1200
        poll_s: 2
        poll_max_s: 10
    limits: { timeout_ms: 1260000, max_output_bytes: 1048576 }
    trials: 1
    deterministic: true
    presets: [no_secret_leak]
    graders:
      - kind: exit_code
        expect: 0
      - kind: exact
        field: output.data.status
        value: pass
      - kind: json_schema
        field: output.data
        schema:
          type: object
          required: [lane, topic, kind, status, failures, service, task_id,
            thread_id, artifact_chars, artifact_sha256, citations, nsources,
            usage, model_policy, trace_id]
          properties:
            kind: { const: research }
            status: { const: pass }
            lane: { enum: [local, remote] }
            task_id: { type: string, minLength: 8 }
            thread_id: { type: string, minLength: 1 }
            artifact_chars: { type: integer }
            artifact_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            citations: { type: integer }
            nsources: { type: integer }
            trace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
            failures: { type: array }
            usage: { type: object }
            model_policy: { type: object }
            service:
              type: object
              required: [health, readiness, effective_ready, submit,
                poll_count, e2e_ms]
              properties:
                effective_ready: { const: true }
                poll_count: { type: integer }
                e2e_ms: { type: integer }
                submit:
                  type: object
                  required: [status, ms]
                  properties:
                    status: { type: integer }
                    ms: { type: integer }
      - kind: range
        field: output.data.artifact_chars
        min: 1500
      - kind: range
        field: output.data.citations
        min: 3
      - kind: range
        field: output.data.nsources
        min: 3
      - kind: range
        field: output.data.service.poll_count
        min: 1
      - kind: range
        field: output.data.service.e2e_ms
        min: 1
      - kind: not_regex
        field: output.text
        pattern: "BREAKING"

  - id: story-rag-grounding
    tags: [agent, research, live, service, story]
    input:
      params:
        mode: live_service
        service_url: "$EVAL_RESEARCH_SERVICE_URL"
        lane: "$EVAL_RESEARCH_SERVICE_LANE"
        dataset: datasets/research_story/topics.json
        topic: rag-grounding
        timeout_s: 1200
        poll_s: 2
        poll_max_s: 10
    limits: { timeout_ms: 1260000, max_output_bytes: 1048576 }
    trials: 1
    deterministic: true
    presets: [no_secret_leak]
    graders:
      - kind: exit_code
        expect: 0
      - kind: exact
        field: output.data.status
        value: pass
      - kind: json_schema
        field: output.data
        schema:
          type: object
          required: [lane, topic, kind, status, failures, service, task_id,
            thread_id, artifact_chars, artifact_sha256, citations, nsources,
            usage, model_policy, trace_id]
          properties:
            kind: { const: research }
            status: { const: pass }
            lane: { enum: [local, remote] }
            task_id: { type: string, minLength: 8 }
            thread_id: { type: string, minLength: 1 }
            artifact_chars: { type: integer }
            artifact_sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            citations: { type: integer }
            nsources: { type: integer }
            trace_id: { type: string, pattern: "^[0-9a-f]{32}$" }
            failures: { type: array }
            usage: { type: object }
            model_policy: { type: object }
            service:
              type: object
              required: [health, readiness, effective_ready, submit,
                poll_count, e2e_ms]
              properties:
                effective_ready: { const: true }
                poll_count: { type: integer }
                e2e_ms: { type: integer }
                submit:
                  type: object
                  required: [status, ms]
                  properties:
                    status: { type: integer }
                    ms: { type: integer }
      - kind: range
        field: output.data.artifact_chars
        min: 1500
      - kind: range
        field: output.data.citations
        min: 3
      - kind: range
        field: output.data.nsources
        min: 3
      - kind: range
        field: output.data.service.poll_count
        min: 1
      - kind: range
        field: output.data.service.e2e_ms
        min: 1
      - kind: not_regex
        field: output.text
        pattern: "BREAKING"
