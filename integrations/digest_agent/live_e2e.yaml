# Real digest entrypoint E2E, free-only.
#
# The target is executed exactly as its own entrypoint:
#   python -m digest_agent.main
# in a temporary working directory. Only the target's Groq adapter is
# configured, so model selection is limited to its fixed free-tier
# candidates. OpenRouter/Gemini/Mistral keys are removed; there is no
# paid fallback. Rate limits or exhaustion fail closed.
#
# NEVER run in CI and never make a paid call. Requires explicit approval
# and free-tier credentials:
#
#   EVAL_DIGEST_GROQ_API_KEY=<free Groq key>
#   EVAL_DIGEST_GITHUB_TOKEN=<read-only token>
#   EVAL_DIGEST_GITHUB_REPOS=amagarzogonzalo/eval-service
#   EVAL_DIGEST_PYTHON=/srv/eval-venvs/digest-agent/bin/python
#   EVAL_DIGEST_SRC=/srv/targets/digest_agent/src
#   EVAL_DIGEST_OUTPUT_DIR=/var/lib/eval-runs/e2e-artifacts
#   EVAL_TRACE_OUT=/var/lib/eval-runs/e2e-traces/digest-live.jsonl
#   EVAL_OTEL_ENDPOINT=http://127.0.0.1:4328
#
#   bash integrations/digest_agent/run_e2e.sh live
#
# Inner stage/token metrics are intentionally n/a: the target exposes
# none and no proxy is used. See docs/digest-e2e.md.
suite: digest-agent-e2e
version: 1
target:
  argv: ["$PYTHON", "integrations/digest_agent/adapter.py"]
  mode: oneshot
env_allowlist: [EVAL_DIGEST_PYTHON, EVAL_DIGEST_SRC, EVAL_DIGEST_GROQ_API_KEY,
  EVAL_DIGEST_GITHUB_TOKEN, EVAL_DIGEST_GITHUB_REPOS, EVAL_DIGEST_BAD_REPOS,
  EVAL_DIGEST_LOOKBACK_DAYS, EVAL_DIGEST_RECIPIENT, EVAL_DIGEST_OUTPUT_DIR,
  EVAL_DIGEST_SMTP_INBOX, EVAL_DIGEST_NOTIFIER, EVAL_DIGEST_ENTRYPOINT_MODE,
  EVAL_DIGEST_PROVIDER, EVAL_DIGEST_ALLOW_PAID, EVAL_DIGEST_MODEL,
  EVAL_DIGEST_METRICS_OUT, EVAL_DIGEST_CASE_TIMEOUT_S,
  EVAL_TRACE_OUT, EVAL_TRACE_OTLP_ENDPOINT, EVAL_OTEL_ENDPOINT,
  EVAL_TRACE_SERVICE, EVAL_TRACE_RUN_ID, EVAL_TRACE_ID, EVAL_TRACEPARENT,
  TRACEPARENT, EVAL_TRACE_DISABLE, EVAL_DIGEST_E2E,
  SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, SMTP_STARTTLS,
  GMAIL_ADDRESS, GMAIL_APP_PASSWORD]
gate:
  min_pass_rate: 1.0
cases:
  # Safe for `eval check --probe`: no network, no model, no target run.
  - id: e2e-free-only-preflight
    tags: [real, e2e, free-only, deterministic]
    input:
      params:
        python: "$EVAL_DIGEST_PYTHON"
        src: "$EVAL_DIGEST_SRC"
        free_only: true
    limits: { timeout_ms: 120000, max_output_bytes: 262144 }
    trials: 1
    deterministic: true
    graders:
      - kind: exit_code
        expect: 0
      - kind: exact
        field: output.data.free_only
        value: "true"
      - kind: exact
        field: output.data.paid_model_configured
        value: "false"
      - kind: exact
        field: output.data.config_scan
        value: "ok"
      - kind: exact
        field: output.data.target_filter
        value: "ok"
      - kind: exact
        field: output.data.provider
        value: "groq"

  # The real entrypoint with no provider key must fail closed.
  - id: e2e-entrypoint-fail-closed
    tags: [real, e2e, free-only, negative, deterministic]
    input:
      params:
        python: "$EVAL_DIGEST_PYTHON"
        src: "$EVAL_DIGEST_SRC"
        entrypoint_mode: preflight
    limits: { timeout_ms: 120000, max_output_bytes: 262144 }
    trials: 1
    deterministic: true
    graders:
      - kind: exit_code
        expect: 0
      - kind: exact
        field: output.data.outcome
        value: error
      - kind: exact
        field: output.data.output_metrics.failure_class
        value: no_llm_provider
      - kind: exact
        field: output.data.output_metrics.free_only
        value: "true"
      - kind: exact
        field: output.data.output_metrics.paid_model_configured
        value: "false"
      - kind: range
        field: output.data.output_metrics.pdf_bytes
        min: 0
        max: 0
      - kind: exact
        field: output.data.email_sent
        value: "false"

  # Real entrypoint, real GitHub, free Groq models, real PDF and SMTP.
  - id: e2e-entrypoint-live-success
    tags: [real, e2e, github, live, free-only]
    input:
      params:
        python: "$EVAL_DIGEST_PYTHON"
        src: "$EVAL_DIGEST_SRC"
        entrypoint_mode: live
    limits: { timeout_ms: 480000, max_output_bytes: 1048576 }
    trials: 2
    deterministic: false
    graders:
      - kind: exit_code
        expect: 0
      - kind: exact
        field: output.data.outcome
        value: success
      - kind: exact
        field: output.data.output_metrics.free_only
        value: "true"
      - kind: exact
        field: output.data.output_metrics.paid_model_configured
        value: "false"
      - kind: exact
        field: output.data.pdf_ok
        value: "true"
      - kind: range
        field: output.data.pdf_bytes
        min: 1000
      - kind: exact
        field: output.data.email_sent
        value: "true"
      - kind: range
        field: output.data.notifier_receipts
        min: 1
        max: 1
      - kind: exact
        field: output.data.output_metrics.inner_metrics.stages
        value: n/a
      - kind: exact
        field: output.data.output_metrics.inner_metrics.tokens
        value: n/a
      - kind: not_regex
        field: output.text
        pattern: "(ghp_[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9._-]{20,})"

  # Real GitHub 404: free-only, no model call, no side effects.
  - id: e2e-entrypoint-live-bad-repo
    tags: [real, e2e, github, negative, free-only]
    input:
      params:
        python: "$EVAL_DIGEST_PYTHON"
        src: "$EVAL_DIGEST_SRC"
        entrypoint_mode: live
        bad_repo: true
    limits: { timeout_ms: 120000, max_output_bytes: 262144 }
    trials: 1
    deterministic: true
    graders:
      - kind: exit_code
        expect: 0
      - kind: exact
        field: output.data.outcome
        value: error
      - kind: exact
        field: output.data.output_metrics.failure_class
        value: github_error
      - kind: exact
        field: output.data.email_sent
        value: "false"
      - kind: range
        field: output.data.notifier_receipts
        min: 0
        max: 0
      - kind: range
        field: output.data.pdf_bytes
        min: 0
        max: 0
