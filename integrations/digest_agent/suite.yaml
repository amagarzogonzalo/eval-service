# Real integration: digest_agent orchestrator driven offline through
# its own fakes. Nothing in the digest_agent repository is modified:
# the adapter shells out to driver.py, which wires the project's real
# LangGraph orchestrator to FakeActivitySource / FakeLLMProvider /
# FakeDocumentRenderer / FakeNotifier.
#
# Absolute machine paths live here — copy this file and adjust for
# your checkout.
suite: digest-agent
version: 1
target:
  argv: ["$PYTHON", "integrations/digest_agent/adapter.py"]
  mode: oneshot
env_allowlist: [EVAL_DIGEST_PYTHON, EVAL_DIGEST_SRC]
gate:
  min_pass_rate: 1.0
cases:
  - id: digest-empty-window
    tags: [real, agent, deterministic]
    input:
      params:
        python: "$EVAL_DIGEST_PYTHON"
        src: "$EVAL_DIGEST_SRC"
        scenario: empty
    limits: { timeout_ms: 180000, max_output_bytes: 1048576 }
    trials: 1
    deterministic: true
    graders:
      - kind: exit_code
        expect: 0
      - kind: regex
        field: output.text
        pattern: "Nothing to report today"
      - kind: range
        field: output.data.attempt_count
        min: 0
        max: 3
      - kind: exact
        field: output.data.email_sent
        value: "true"
  - id: digest-single-pr-bounded
    tags: [real, agent, deterministic]
    input:
      params:
        python: "$EVAL_DIGEST_PYTHON"
        src: "$EVAL_DIGEST_SRC"
        scenario: single-pr
    limits: { timeout_ms: 180000, max_output_bytes: 1048576 }
    trials: 2
    deterministic: true
    graders:
      - kind: exit_code
        expect: 0
      - kind: regex
        field: output.text
        pattern: "PR #7"
      - kind: regex
        field: output.text
        pattern: "src/app\\.py"
      - kind: range
        field: output.data.attempt_count
        min: 0
        max: 3
      - kind: stability


