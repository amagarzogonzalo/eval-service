# Dependency policy for `cargo deny check`.
#
# Scope: supply-chain and license checks for the Rust dependency graph. This is
# not a formal security audit, a code review, or a claim that the project is
# free of vulnerabilities. The advisory check uses the public RustSec database.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; it is pulled in by the existing serde_yaml dependency and has no safe upgrade. Tracked as a dependency-replacement follow-up, not waived as safe." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
# Workspace path dependencies intentionally omit redundant version specs.
# They are still visible as warnings; external wildcard requirements are not
# introduced by this policy.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
