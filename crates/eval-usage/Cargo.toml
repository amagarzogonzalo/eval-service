[package]
name = "eval-usage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned LLM-call events, idempotent store, pricing, aggregation"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
blake3 = "1.5"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
