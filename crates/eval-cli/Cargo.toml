[package]
name = "eval-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "eval run/compare/report/init commands (M4)"

[[bin]]
name = "eval"
path = "src/main.rs"

[dependencies]
eval-core = { path = "../eval-core" }
eval-graders = { path = "../eval-graders" }
eval-runner = { path = "../eval-runner" }
eval-usage = { path = "../eval-usage" }
eval-proxy = { path = "../eval-proxy" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
blake3 = "1.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
