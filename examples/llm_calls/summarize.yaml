suite: llm-summarize
version: 1
target:
  argv: ["$PYTHON", "examples/llm_calls/target.py"]
  mode: oneshot
env_allowlist: []
gate:
  min_pass_rate: 1.0
cases:
  - id: summarize-coverage
    tags: [llm, summarization, offline]
    input:
      params:
        task: summarize
        text: "The council met to debate the transit budget for the new lines."
    limits: { timeout_ms: 30000, max_output_bytes: 65536 }
    trials: 1
    deterministic: true
    graders:
      - kind: json_schema
        field: output.data
        schema:
          type: object
          required: [summary, keywords_covered]
          properties:
            summary: { type: string }
      - kind: regex
        field: output.data.keywords_covered
        pattern: "transit"
      - kind: regex
        field: output.data.keywords_covered
        pattern: "budget"
      - kind: judge_lite
        field: output.text
        min_score: 0.5
